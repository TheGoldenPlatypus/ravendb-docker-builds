name: Build Quill Docker image
on:
  workflow_call:
    inputs:
      version:
        description: 'Quill version'
        required: true
        type: string
      docker_user:
        description: 'DockerHub username'
        required: false
        type: string
        default: ravendb
      docker_repo:
        description: 'DockerHub repository'
        required: false
        type: string
        default: ravendb/quill
      github_repository:
        description: 'Github repository'
        required: false
        type: string
        default: ravendb/ravendb
      github_ref:
        description: 'Git ref of github_repository to build from'
        required: false
        type: string
        default: feature/ai-appliance
      platforms:
        description: 'Comma-separated buildx platforms'
        required: false
        type: string
        default: linux/amd64
      push_latest_tags:
        description: 'Also push :latest and :<minor>-latest floating tags'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run - build locally, skip login/push'
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      version:
        description: 'Quill version'
        required: true
        type: string
      docker_user:
        description: 'DockerHub username'
        required: false
        type: string
        default: ravendb
      docker_repo:
        description: 'DockerHub repository'
        required: false
        type: string
        default: ravendb/quill
      github_repository:
        description: 'Github repository'
        required: false
        type: string
        default: ravendb/ravendb
      github_ref:
        description: 'Git ref of github_repository to build from'
        required: false
        type: string
        default: feature/ai-appliance
      platforms:
        description: 'Comma-separated buildx platforms'
        required: false
        type: string
        default: linux/amd64
      push_latest_tags:
        description: 'Also push :latest and :<minor>-latest floating tags'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run - build locally, skip login/push'
        required: false
        type: string
        default: ''

env:
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.github_repository }}@${{ inputs.github_ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.github_repository }}
          ref: ${{ inputs.github_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          V="${{ inputs.version }}"
          MINOR="${V%.*}"
          REPO="${{ inputs.docker_repo }}"
          echo "pinned=$REPO:$V" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.push_latest_tags }}" = "true" ]; then
            echo "minor=$REPO:$MINOR-latest" >> "$GITHUB_OUTPUT"
            echo "latest=$REPO:latest"       >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: ${{ inputs.dry_run == '' }}
        env:
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: docker login -u ${{ inputs.docker_user }} -p "$DOCKER_HUB_PASSWORD"

      - name: Build & push
        shell: bash
        run: |
          extraTags=""
          if [ -n "${{ steps.tags.outputs.minor }}" ]; then
            extraTags="--tag ${{ steps.tags.outputs.minor }} --tag ${{ steps.tags.outputs.latest }}"
          fi

          # Dry-run: build locally (no --push) so we still validate the image builds.
          pushFlag="--push"
          [ -n "$DRY_RUN" ] && pushFlag=""

          ./docker/quill/scripts/build.sh \
            --tag ${{ steps.tags.outputs.pinned }} \
            $extraTags \
            --platforms ${{ inputs.platforms }} \
            $pushFlag

      - name: Docker logout
        if: ${{ always() && inputs.dry_run == '' }}
        run: docker logout || true
